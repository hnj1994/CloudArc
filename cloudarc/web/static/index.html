<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudArc Console</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 22a8 8 0 0 1 16-6 6 6 0 1 1 2 12H8a4 4 0 0 1-2-6z' fill='%232a78d6'/></svg>">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-card">
      <h1><span class="logo">☁</span> CloudArc</h1>
      <p class="muted">Cloud cost management &amp; governance</p>
      <button id="sso-btn" class="btn primary hidden">Sign in with Microsoft</button>
      <button id="token-toggle" class="link-btn hidden" type="button">Use an API token instead</button>
      <form id="token-form" class="hidden">
        <label for="token">API token</label>
        <input id="token" type="password" autocomplete="off" placeholder="ca_…" required>
        <button class="btn primary" type="submit">Sign in with token</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <div id="shell" class="shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">☁</span> CloudArc</div>
      <label class="tenant-label" for="tenant-select">Client</label>
      <select id="tenant-select"></select>
      <nav id="nav">
        <a href="#dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg><span>Dashboard</span></a>
        <a href="#explorer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></svg><span>Cost explorer</span></a>
        <a href="#allocation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><span>Allocation &amp; tags</span></a>
        <a href="#budgets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><circle cx="16.5" cy="14" r="1.2"/></svg><span>Budgets</span></a>
        <a href="#alerts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>Alerts</span></a>
        <a href="#recommendations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg><span>Recommendations</span></a>
        <a href="#inventory"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg><span>Inventory</span></a>
        <a href="#reports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg><span>Reports</span></a>
        <a href="#accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span>Accounts &amp; data</span></a>
        <a href="#admin" data-admin><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg><span>Administration</span></a>
      </nav>
      <div class="sidebar-foot">
        <div id="whoami" class="muted small"></div>
        <button id="theme-btn" class="btn ghost small" type="button">Theme</button>
        <button id="logout-btn" class="btn ghost small" type="button">Sign out</button>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <button id="menu-btn" class="btn ghost small menu-btn" type="button" aria-label="Menu">☰</button>
        <h2 id="page-title">Dashboard</h2>
        <span id="as-of" class="pill"></span>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
