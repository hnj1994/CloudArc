[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudarc"
version = "0.1.0"
description = "Multi-tenant, multi-cloud cost management & governance platform (FinOps)"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "cryptography>=42",
  "pyjwt[crypto]>=2.8",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.0",
  "matplotlib>=3.8",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cloudarc = "cloudarc.cli:main"

[tool.setuptools.packages.find]
include = ["cloudarc*"]

[tool.setuptools.package-data]
cloudarc = ["web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["B008"]  # FastAPI dependencies are declared as call defaults (Depends(...), Query(...))
