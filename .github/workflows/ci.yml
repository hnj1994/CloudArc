name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt && pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cloudarc tests
      - name: Unit + integration tests (includes the tenant-isolation suite)
        run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.lock.txt

  browser:
    # The real app with demo data in Chromium: every console view, no JS errors, no CSP violations.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt && pip install -e ".[dev]" && pip install "playwright==1.63.0"
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python -m pytest -q tests/test_browser_smoke.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudarc:ci .
