name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt && pip install -e ".[dev]"
      - name: Unit + integration tests (includes the tenant-isolation suite)
        run: python -m pytest -q
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.lock.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cloudarc:ci .
