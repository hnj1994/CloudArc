name: Deploy to Azure App Service
# Continuous deployment of the console as Python code (same path as deploy/azure/deploy-webapp-code.sh).
# One-time setup: run deploy/azure/setup-github-deploy.ps1 (or .sh). It creates a dedicated Entra app with a
# federated credential for this repository's main branch (OIDC, no stored secret), grants it Website
# Contributor on the web app only, and sets:
#   secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   vars:    AZURE_WEBAPP_NAME, AZURE_RESOURCE_GROUP
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency: deploy-azure

jobs:
  deploy:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Tests must pass before deploying
        run: pip install -r requirements.lock.txt && pip install -e ".[dev]" && python -m pytest -q
      - name: Package source for the App Service (Oryx) build
        run: git archive --format=zip -o cloudarc.zip HEAD cloudarc pyproject.toml README.md requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        run: |
          az webapp deploy -n "${{ vars.AZURE_WEBAPP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --src-path cloudarc.zip --type zip --async false
      - name: Health check
        run: |
          host=$(az webapp show -n "${{ vars.AZURE_WEBAPP_NAME }}" -g "${{ vars.AZURE_RESOURCE_GROUP }}" --query defaultHostName -o tsv)
          for i in $(seq 1 40); do curl -fsS "https://$host/api/health" && exit 0; sleep 15; done
          echo "health check failed"; exit 1
